name: Registry Monitor

on:
  schedule:
    # Every 48 hours, at 04:00 UTC on odd days. 04:00 UTC = ~midnight US
    # eastern / off-peak, when the Verra API rate-limit pool is least
    # congested (learned from the launch-week throttling).
    - cron: "0 4 1-31/2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # No browser needed anymore - we call the JSON API directly.

      - name: Run the monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python run.py

      - name: Commit updated database and dashboard
        run: |
          git config user.name "registry-monitor-bot"
          git config user.email "actions@github.com"
          git add monitor.db dashboard.html alerts.log
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated run: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi